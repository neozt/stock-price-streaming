<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Random Price Generator</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] {
            display: none !important;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
    </style>
  </head>

  <body class="bg-light">
    <div class="container py-5" x-data="randomGenerator()" x-cloak>
      <div>
        <div>Random Price Generator is <span x-text="enabled ? 'turned on' : 'turned off'"></span>.</div>
        <button
                class="btn btn-primary btn-sm"
                @click="toggleEnabled()"
                x-text="enabled ? 'Disable' : 'Enable'"
        ></button>
      </div>

      <!-- Loading State -->
      <div class="loading-overlay" x-show="loading">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>

      <!-- Error Alert -->
      <div class="alert alert-danger" role="alert" x-show="error" x-text="error" @click="error = null"
           style="cursor: pointer;">
      </div>

    </div>

    <script>
        function randomGenerator() {
            const GENERATOR_INTERVAL_MS = 1000;

            return {
                enabled: false,
                generator: null,
                loading: false,
                error: null,
                apiUrl: '${ClaimsApiUrl}',
                toggleEnabled() {
                    if (this.enabled) {
                        this.disable();
                    } else {
                        this.enable()
                    }
                },
                enable() {
                    this.resetGenerator();
                    let counter = 0;
                    this.generator = setInterval(
                        () => {
                            console.log('count is ' + counter++)
                        },
                        GENERATOR_INTERVAL_MS
                    )

                    this.enabled = true;
                },
                disable() {
                    this.resetGenerator();
                    this.enabled = false;
                },
                resetGenerator() {
                    if (this.generator) {
                        clearInterval(this.generator);
                        this.generator = null;
                    }
                }
            }
        }

        // Expose Alpine to window and start it
        window.Alpine = Alpine;
        Alpine.start();
    </script>
  </body>
</html>

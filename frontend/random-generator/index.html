    <style>
        [x-cloak] {
            display: none !important;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;

      <div>
        <div>Random Price Generator is <span x-text="enabled ? 'turned on' : 'turned off'"></span>.</div>
        <button
                class="btn btn-primary btn-sm"
                @click="toggleEnabled()"
                x-text="enabled ? 'Disable' : 'Enable'"
        ></button>
      </div>

      <!-- Loading State -->
      <div class="loading-overlay" x-show="loading">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>

      <!-- Error Alert -->
      <div class="alert alert-danger" role="alert" x-show="error" x-text="error" @click="error = null"
           style="cursor: pointer;">
      </div>

        function randomGenerator() {
            const GENERATOR_INTERVAL_MS = 1000;

            return {
                enabled: false,
                generator: null,
                stockList: [],
                loading: false,
                error: null,
                apiUrl: '${ClaimsApiUrl}',
                toggleEnabled() {
                    if (this.enabled) {
                        this.disable();
                    } else {
                        this.enable()
                    }
                },
                enable() {
                    this.resetGenerator();
                    this.stockList = getRandomStocks();
                    this.generator = setInterval(
                        () => {
                            this.stockList = randomisePrice(this.stockList);
                            console.log('Generated stock list', this.stockList);
                        },
                        GENERATOR_INTERVAL_MS
                    );

                    this.enabled = true;
                },
                disable() {
                    this.resetGenerator();
                    this.enabled = false;
                },
                resetGenerator() {
                    if (this.generator) {
                        clearInterval(this.generator);
                        this.generator = null;
                    }
                }
            }
        }

            console.log('Randomising price...');
            return [...stockList];

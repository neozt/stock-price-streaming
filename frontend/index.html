<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stock Price Streaming</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] {
            display: none !important;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
    </style>
  </head>

  <body class="bg-light">
    <div class="container py-5" x-data="randomGenerator()" x-cloak>
<!--      <div class="d-flex justify-content-between align-items-center mb-4">-->
<!--        <h1 class="h3">Pending Claims Approval</h1>-->
<!--        <button class="btn btn-outline-primary btn-sm" @click="fetchClaims()">Refresh List</button>-->
<!--      </div>-->

      <!-- Loading State -->
      <div class="loading-overlay" x-show="loading">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>

      <!-- Error Alert -->
      <div class="alert alert-danger" role="alert" x-show="error" x-text="error" @click="error = null"
           style="cursor: pointer;">
      </div>

    </div>

    <script>
        function randomGenerator() {
            return {
                loading: false,
                error: null,
                apiUrl: '${ClaimsApiUrl}',

            }
        }

        // Expose Alpine to window and start it
        window.Alpine = Alpine;
        Alpine.start();
    </script>
  </body>
</html>

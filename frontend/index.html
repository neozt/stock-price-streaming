<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stock Price Streaming</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>

    <style>
        [x-cloak] {
            display: none !important;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
    </style>
  </head>

  <body class="bg-light">
    <div class="container py-5" x-data="stockPriceStreamer" x-cloak>

      <!-- Streaming Dashboard -->
      <div x-show="apiKey">
        <div class="mb-3">
          <a href="/market-simulator/" class="text-decoration-none text-secondary small">
            Go to Market Simulator &rarr;
          </a>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h2 class="mb-0">Streaming Dashboard</h2>
            <p class="text-muted mb-0">
              Connection: <span class="badge" :class="connected ? 'bg-success' : 'bg-secondary'"
                                x-text="connected ? 'Connected' : 'Disconnected'"></span>
            </p>
          </div>
          <div class="text-end" x-show="lastUpdated">
            <small class="text-muted d-block">Last Update</small>
            <div class="h5 mb-0" x-text="lastUpdated && lastUpdated.toLocaleTimeString()"></div>
          </div>
        </div>

        <div class="card shadow-sm">
          <div class="card-body p-0">
            <div id="priceTable" class="ag-theme-quartz" style="height: 700px; width: 100%;"></div>
          </div>
        </div>

      </div>

      <!-- Connection Screen -->
      <div x-show="!apiKey">
        <div class="card p-4 shadow-sm" style="max-width: 500px; margin: auto;">
          <div class="text-center mb-4">
            <div class="display-6 mb-2">📡</div>
            <h3 class="card-title">Stock Streaming Dashboard</h3>
            <p class="text-muted">Enter your AppSync API Key to subscribe to the real-time stock price feed.</p>
          </div>
          <div class="mb-3">
            <label class="form-label" for="apiKeyInput">API Key</label>
            <input id="apiKeyInput" type="text" class="form-control" x-model="apiKeyInput"
                   placeholder="da2-xxxxxxxxxxxxxxxxxxxxxxxxxx" @keyup.enter="setApiKey()"/>
          </div>
          <button class="btn btn-primary w-100 py-2" @click="setApiKey()">Go to Dashboard</button>
        </div>
      </div>

      <!-- Loading State -->
      <div class="loading-overlay" x-show="loading">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>

      <!-- Error Alert -->
      <div class="alert alert-danger" role="alert" x-show="error" x-text="error" @click="error = null"
           style="cursor: pointer;">
      </div>

    </div>

    <script type="module">
        import {Amplify} from 'https://esm.sh/aws-amplify@6';
        import {events} from 'https://esm.sh/aws-amplify@6/api';
        import Alpine from 'https://cdn.jsdelivr.net/npm/alpinejs@3.13.8/dist/module.esm.js';

        const APP_SYNC_HTTP_ENDPOINT = '%%AppSyncHttpEndpoint%%';
        const CHANNEL = 'stocks/top-volume-30';

        Alpine.data('stockPriceStreamer', () => {
            return {
                apiKey: null,
                apiKeyInput: '',
                loading: false,
                error: null,
                connection: null,
                subscription: null,
                connected: false,
                lastUpdated: null,
                gridApi: null,

                setApiKey() {
                    if (!this.apiKeyInput) {
                        return;
                    }
                    this.apiKey = this.apiKeyInput;
                    this.apiKeyInput = '';

                    // Minor timeout forces DOM update prior to mounting AG Grid ensuring accurate column sizes
                    setTimeout(() => {
                        this.initGrid();
                    }, 50);

                    this.connectStream();
                },

                initGrid() {
                    if (this.gridApi) return;

                    const priceFormatter = (p) => p.value ? p.value.toFixed(4) : '';
                    const suffixFormatter = (p) => {
                        if (!p.value) return '';
                        const val = p.value;
                        if (val >= 1e12) return (val / 1e12).toFixed(2) + 'T';
                        if (val >= 1e9) return (val / 1e9).toFixed(2) + 'B';
                        if (val >= 1e6) return (val / 1e6).toFixed(2) + 'M';
                        if (val >= 1e3) return (val / 1e3).toFixed(2) + 'k';
                        return val.toFixed(2);
                    };

                    const gridOptions = {
                        rowData: [],
                        getRowId: (params) => params.data.symbol,
                        columnDefs: [
                            {field: 'symbol', headerName: 'Symbol', minWidth: 100},
                            {
                                headerName: 'Last Price',
                                field: 'lastPrice',
                                minWidth: 200,
                                valueFormatter: priceFormatter,
                                cellRenderer: (params) => {
                                    const history = params.data.priceHistory;
                                    const price = params.valueFormatted;

                                    if (history.length < 2) {
                                        return `<span style="font-weight: 600;">${price}</span>`;
                                    }

                                    const min = Math.min(...history);
                                    const max = Math.max(...history);
                                    const range = max - min;
                                    const width = 80;
                                    const height = 20;
                                    const points = history.map((val, i) => {
                                        const x = (i / (history.length - 1)) * width;
                                        const y = height - ((val - min) / range) * height;
                                        return `${x},${y}`;
                                    }).join(' ');

                                    const isUp = params.value >= params.data.previousClose;
                                    const color = isUp ? '#198754' : '#dc3545';

                                    return `
                                        <div class="d-flex align-items-center justify-content-between w-100">
                                            <span style="font-weight: 600;">${price}</span>
                                            <svg width="${width}" height="${height}" style="overflow: visible; margin-left: 10px;">
                                                <polyline points="${points}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                                            </svg>
                                        </div>
                                    `;
                                }
                            },
                            {field: 'askPrice', headerName: 'Ask Price', valueFormatter: priceFormatter},
                            {field: 'bidPrice', headerName: 'Bid Price', valueFormatter: priceFormatter},
                            {
                                field: 'volume',
                                headerName: 'Volume',
                                valueFormatter: suffixFormatter,
                                sortable: true,
                                sort: 'desc'
                            },
                            {field: 'marketCap', headerName: 'Market Cap', valueFormatter: suffixFormatter},
                        ],
                        defaultColDef: {
                            flex: 1,
                            sortable: true,
                            resizable: true,
                            enableCellChangeFlash: true,
                            cellDataType: false // Disable auto-inference to handle custom flashing manually
                        }
                    };

                    const priceTableElement = document.querySelector('#priceTable');
                    this.gridApi = agGrid.createGrid(priceTableElement, gridOptions);
                },

                async connectStream() {
                    this.loading = true;
                    this.error = null;

                    // Extract region from hostname
                    const region = APP_SYNC_HTTP_ENDPOINT.split('.')[2] || 'us-east-1';

                    try {
                        Amplify.configure({
                            API: {
                                Events: {
                                    endpoint: `https://${APP_SYNC_HTTP_ENDPOINT}/event`,
                                    region: region,
                                    defaultAuthMode: 'apiKey',
                                    apiKey: this.apiKey
                                }
                            }
                        });

                        console.log('Connecting to Amplify Events channel:', CHANNEL);
                        this.connection = await events.connect(CHANNEL);

                        this.subscription = await this.connection.subscribe({
                            next: (data) => {
                                this.processData(data);
                            },
                            error: (err) => {
                                console.error('Subscription error:', err);
                                this.error = "Streaming Error: " + (err.message || JSON.stringify(err));
                                this.connected = false;
                            }
                        });

                        this.connected = true;
                        this.loading = false;
                        console.log('Connected to Amplify Events!');
                    } catch (e) {
                        this.error = 'Failed to connect via Amplify: ' + e.message;
                        this.loading = false;
                        this.connected = false;
                    }
                },

                processData(event) {
                    try {
                        const payload = event.event;
                        this.gridApi.setGridOption("rowData", payload.data);
                        this.lastUpdated = new Date(Date.parse(payload.updatedAt))
                    } catch (e) {
                        console.error("Error processing event data", e, event);
                    }
                }
            }
        });

        window.Alpine = Alpine;
        Alpine.start();
    </script>
  </body>
</html>
